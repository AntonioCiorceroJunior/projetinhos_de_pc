// FPS e frame pacing
fps_max "300"
fps_max_ui "120"

// Console
con_enable "1"

// Latência / sensação de resposta
engine_low_latency_sleep_after_client_tick "true"

// Rede / telemetria visual opcional
cq_netgraph "0"

// Salva a config
// FPS discreto no canto superior direito
cl_hud_telemetry_frametime_show "2"

host_writeconfig