// ===============================
// treino.cfg - CS2
// Treino livre: granadas, spray, lineups e movimentação
// ===============================

sv_cheats 1

// -------------------------------
// Round / tempo / economia
// -------------------------------
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_maxrounds 999
mp_ignore_round_win_conditions 1
mp_restartgame 1

mp_buytime 60000
mp_buy_anywhere 1
mp_maxmoney 60000
mp_startmoney 60000
mp_afterroundmoney 60000

// -------------------------------
// Bots
// -------------------------------
bot_kick
bot_quota 0

// -------------------------------
// Munição / granadas
// -------------------------------
sv_infinite_ammo 1
ammo_grenade_limit_total 6

// -------------------------------
// Vida / imortalidade
// -------------------------------
buddha 1
buddha_reset_hp 100

// -------------------------------
// Granadas - preview e trajetória
// -------------------------------
cl_grenadepreview 1
sv_grenade_trajectory_prac_pipreview 1
sv_grenade_trajectory_prac_trailtime 8

// -------------------------------
// Spray / impactos de tiro
// -------------------------------
sv_showimpacts 1
sv_showimpacts_time 10

// -------------------------------
// Binds úteis
// -------------------------------

// V = noclip
bind "v" "noclip"

// I = repetir a última granada
bind "i" "sv_rethrow_last_grenade"

// K = limpar smokes e molotovs/incendiárias do mapa
bind "k" "ent_fire smokegrenade_projectile kill; ent_fire inferno kill"

// O = reiniciar round
bind "o" "mp_restartgame 1"

// P = dar todas as granadas principais
bind "p" "give weapon_hegrenade; give weapon_flashbang; give weapon_smokegrenade; give weapon_molotov; give weapon_incgrenade"

// -------------------------------
// Equipamentos básicos
// -------------------------------
mp_ct_default_primary weapon_m4a1_silencer
mp_t_default_primary weapon_ak47
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_glock
mp_free_armor 2

// -------------------------------
// Confirmação
// -------------------------------
echo "==============================="
echo " treino.cfg carregada"
echo " V = noclip"
echo " I = repetir granada"
echo " K = limpar smoke/molotov"
echo " O = reiniciar round"
echo " P = pegar granadas"
echo "==============================="