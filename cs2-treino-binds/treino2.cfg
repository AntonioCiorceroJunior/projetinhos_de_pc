// ===============================
// treino2.cfg - CS2
// Treino real contra bots difíceis
// Padrão: você CT contra 10 bots TR
// ===============================

sv_cheats 1

// -------------------------------
// Round / tempo / economia
// -------------------------------
mp_warmup_end
mp_freezetime 5
mp_maxrounds 20
mp_ignore_round_win_conditions 0
mp_restartgame 1

mp_buy_anywhere 0
mp_maxmoney 16000
mp_startmoney 800
mp_afterroundmoney 0

// -------------------------------
// Times / balanceamento
// -------------------------------
mp_autoteambalance 0
mp_limitteams 0

// -------------------------------
// Bots
// -------------------------------
bot_kick
bot_quota 0

bot_difficulty 3
custom_bot_difficulty 3

bot_stop 0
bot_zombie 0
bot_dont_shoot 0
bot_chatter off

// Padrão: adiciona 10 bots no time TR
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t
bot_add_t

// -------------------------------
// Munição / granadas
// -------------------------------
sv_infinite_ammo 0
ammo_grenade_limit_total 4

// -------------------------------
// Vida normal
// -------------------------------
buddha 0
sv_regeneration_force_on 0

// -------------------------------
// Sem ajuda visual de granadas
// -------------------------------
cl_grenadepreview 0
sv_grenade_trajectory_prac_pipreview 0
sv_grenade_trajectory_prac_trailtime 0

// -------------------------------
// Sem impactos visuais
// -------------------------------
sv_showimpacts 0
sv_showimpacts_time 0

// -------------------------------
// Sem respawn instantâneo
// -------------------------------
mp_respawn_on_death_t 0
mp_respawn_on_death_ct 0

// -------------------------------
// Remove binds de treino livre
// -------------------------------
unbind "v"
unbind "i"
unbind "k"
unbind "p"

// Mantém O para reiniciar o treino, se quiser
bind "o" "mp_restartgame 1"

// -------------------------------
// Comandos opcionais para trocar o lado dos bots
// -------------------------------

// Se você estiver CT e quiser bots TR:
alias treino2_vs_t "bot_kick; bot_add_t; bot_add_t; bot_add_t; bot_add_t; bot_add_t; bot_add_t; bot_add_t; bot_add_t; bot_add_t; bot_add_t; mp_restartgame 1"

// Se você estiver TR e quiser bots CT:
alias treino2_vs_ct "bot_kick; bot_add_ct; bot_add_ct; bot_add_ct; bot_add_ct; bot_add_ct; bot_add_ct; bot_add_ct; bot_add_ct; bot_add_ct; bot_add_ct; mp_restartgame 1"

// -------------------------------
// Confirmação
// -------------------------------
echo "==============================="
echo " treino2.cfg carregada"
echo " Bots no mais dificil"
echo " Padrão: 10 bots TR"
echo " Use treino2_vs_t para bots TR"
echo " Use treino2_vs_ct para bots CT"
echo " O = reiniciar round"
echo "==============================="